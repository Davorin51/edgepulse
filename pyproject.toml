[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "edgepulse-lab"
version = "0.1.0"
description = "Local edge telemetry and fault-injection lab with a Linux agent"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "pytest-cov>=6,<8", "hypothesis>=6,<7", "ruff>=0.11,<1", "build>=1,<2"]
[project.scripts]
edgepulse-agent = "edgepulse.agent:main"
[tool.setuptools]
packages = ["edgepulse"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
